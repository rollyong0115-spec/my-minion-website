<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Banana Code - Gru's Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            margin: 0; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 20px;
        }
        .card {
            background: white; border: 4px solid #fedb00; width: 100%; max-width: 380px;
            padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center;
        }
        h2 { margin: 0 0 6px 0; color: #1e3a8a; }
        p { color: #64748b; font-size: 13px; margin: 0 0 16px 0; }
        input {
            width: 100%; padding: 12px 14px; margin: 8px 0; background: #f8fafc;
            border: 2px solid #cbd5e1; border-radius: 12px; font-family: inherit; font-size: 14px; outline: none;
        }
        input:focus { border-color: #fedb00; background: #ffffff; }
        button {
            width: 100%; padding: 13px; background: #fedb00; color: #1e3a8a; border: 2px solid #ca8a04;
            border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 700; margin-top: 10px;
            font-family: inherit; box-shadow: 0 4px 0 #ca8a04;
        }
        button:hover { background: #fde047; }
        .msg { margin-top: 12px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Set New Password 🔑</h2>
    <p>Enter a new strong Banana Code (8+ characters with letters, numbers, and symbols):</p>
    
    <input type="password" id="new-password" placeholder="New Password" required>
    <input type="password" id="confirm-password" placeholder="Confirm Password" required>
    
    <button onclick="submitNewPassword()">Save New Password &#10004;</button>
    <div id="status-msg" class="msg"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    function checkStrongPassword(pwd) {
        return pwd && pwd.length >= 8 && /[a-zA-Z]/.test(pwd) && /[0-9]/.test(pwd) && /[!@#$%^&*(),.?":{}|<>\-_=+]/.test(pwd);
    }

    async function submitNewPassword() {
        const newPassword = document.getElementById('new-password').value.trim();
        const confirmPassword = document.getElementById('confirm-password').value.trim();
        const msg = document.getElementById('status-msg');

        if (!token) {
            msg.style.color = '#ef4444';
            msg.innerText = 'Invalid or missing reset token!';
            return;
        }
        if (!checkStrongPassword(newPassword)) {
            msg.style.color = '#ef4444';
            msg.innerText = 'Password must be 8+ characters with letters, numbers, and symbols (e.g. Banana!123)!';
            return;
        }
        if (newPassword !== confirmPassword) {
            msg.style.color = '#ef4444';
            msg.innerText = 'Passwords do not match!';
            return;
        }

        msg.style.color = '#1e3a8a';
        msg.innerText = 'Saving new password...';

        try {
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            const data = await res.json();

            if (res.ok) {
                msg.style.color = '#22c55e';
                msg.innerText = data.message;
                setTimeout(() => window.location.href = '/index.html', 1500);
            } else {
                msg.style.color = '#ef4444';
                msg.innerText = data.error;
            }
        } catch (err) {
            msg.style.color = '#ef4444';
            msg.innerText = 'Failed to connect to server.';
        }
    }
</script>
</body>
</html>
