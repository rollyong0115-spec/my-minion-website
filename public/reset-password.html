<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Gru's Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Open Sans', sans-serif;
            background: #2563eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #facc15;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h2 {
            font-family: 'Fredoka One', cursive;
            color: #1e3a8a;
            margin-bottom: 8px;
            font-size: 1.6rem;
        }
        p.subtitle {
            font-size: 0.82rem;
            color: #64748b;
            margin-bottom: 22px;
            line-height: 1.3;
        }
        .input-group {
            position: relative;
            margin-bottom: 14px;
        }
        input {
            width: 100%;
            padding: 12px 48px 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #facc15;
        }
        .toggle-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            box-shadow: none;
            width: auto;
            color: #475569;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #facc15;
            color: #1e3a8a;
            border: none;
            border-radius: 12px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #ca8a04;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ca8a04;
        }
        #message {
            margin-top: 15px;
            font-size: 0.88rem;
            font-weight: 600;
        }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set New Password 🔑</h2>
        <p class="subtitle">Enter a new strong Banana Code (8+ characters with letters, numbers, and symbols):</p>
        
        <form id="resetForm">
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="New Password" required />
                <button type="button" class="toggle-eye" id="eyeBtn1" onclick="togglePasswordVisibility('newPassword', this)">👁️</button>
            </div>
            
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
                <button type="button" class="toggle-eye" id="eyeBtn2" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</button>
            </div>
            
            <button type="submit" class="submit-btn">Save New Password ✔</button>
        </form>
        
        <div id="message"></div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.className = '';
            messageDiv.textContent = 'Updating password...';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Passwords do not match!';
                return;
            }

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    messageDiv.className = 'success';
                    messageDiv.textContent = data.message;
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                } else {
                    messageDiv.className = 'error';
                    messageDiv.textContent = data.error || 'Failed to reset password.';
                }
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Server error. Please try again later.';
            }
        });
    </script>
</body>
</html>
