<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gru's Secret Lab - Minion Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- 1. FULLSCREEN FUNNY SCENE BACKGROUND --- */
        .funny-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://media.giphy.com/media/YAlhwn8730P4DUZ6Zh/giphy.gif');
            background-size: cover;
            background-position: center;
            filter: blur(4px) brightness(0.45);
            transform: scale(1.05); /* Avoid blur edges */
            z-index: 1;
        }

        /* Dark Vignette Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.85) 100%);
            z-index: 2;
        }

        /* --- 2. FOREGROUND CARD --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        /* Funny Minion Header GIF */
        .funny-header-gif {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fedb00;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 15px rgba(254, 219, 0, 0.4);
            margin-bottom: -50px;
            z-index: 15;
            background-color: #fedb00;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .funny-header-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Glassmorphism Clean Card */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #fedb00;
            width: 100%;
            padding: 60px 30px 28px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            color: #1e293b;
        }

        h2 { margin: 0 0 4px 0; color: #1e3a8a; font-size: 26px; font-weight: 700; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 16px; }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 6px 0;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #fedb00;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(254, 219, 0, 0.4);
        }

        #signup-fields { display: none; }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: #fedb00;
            color: #1e3a8a;
            border: 2px solid #ca8a04;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            margin-top: 12px;
            font-family: inherit;
            box-shadow: 0 4px 0 #ca8a04;
            transition: all 0.1s ease;
        }
        button.submit-btn:hover { background: #fde047; transform: translateY(-2px); box-shadow: 0 6px 0 #ca8a04; }
        button.submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #ca8a04; }

        .toggle-box { margin-top: 16px; font-size: 14px; color: #64748b; }
        .toggle-box a { color: #2563eb; font-weight: 700; text-decoration: underline; cursor: pointer; }
        .message { margin-top: 10px; font-size: 13px; font-weight: 600; min-height: 18px; }

        /* Funny Gibberish Generator */
        .gibberish-box {
            margin-top: 15px;
            background: #fef08a;
            border: 2px dashed #ca8a04;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #854d0e;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .gibberish-box:hover { transform: scale(1.02); background: #fde047; }
    </style>
</head>
<body>

    <!-- 1. Fullscreen Funny Minion Scene Backdrop -->
    <div class="funny-bg"></div>
    <div class="overlay"></div>

    <!-- 2. Login / Sign Up Card -->
    <div class="login-wrapper">
        <!-- Funny Siren Minion Header -->
        <div class="funny-header-gif">
            <img src="https://media.giphy.com/media/YAlhwn8730P4DUZ6Zh/giphy.gif" alt="Bee-Doo Minion">
        </div>

        <div class="card">
            <h2 id="form-title">BEE-DOO! &#128680;</h2>
            <div class="subtitle" id="form-subtitle">Enter Gru's Lab before the alarm triggers!</div>

            <div id="signup-fields">
                <input type="text" id="fullName" placeholder="Full Minion Name">
                <input type="email" id="email" placeholder="Email Address">
                <input type="tel" id="phone" placeholder="Contact Number (e.g. 09123456789)">
            </div>

            <input type="text" id="username" placeholder="Username or Email" required>
            <input type="password" id="password" placeholder="Banana Code (Password)" required>

            <button class="submit-btn" id="submit-btn" onclick="submitAuth()">Log In &#128640;</button>
            <div id="message" class="message"></div>

            <div class="toggle-box">
                <span id="toggle-label">Don't have an ID?</span>
                <a onclick="toggleForm()" id="toggle-link">Join Gru's Crew</a>
            </div>

            <!-- Clickable Minion quote generator -->
            <div class="gibberish-box" onclick="randomQuote()">
                &#127820; Minion Translator: <b id="quote-text">"Papoi? Gelato!"</b> <i>(Click for new quote)</i>
            </div>
        </div>
    </div>

<script>
    let isLogin = true;

    const quotes = [
        '"BEE-DOO! BEE-DOO! BEE-DOO! 🚨"',
        '"BANANAAAAAA! 🍌"',
        '"Poopaye! Bello! 👋"',
        '"Tulaliloo ti amo! ❤️"',
        '"Underwear... hehehe! 😂"',
        '"Gelato! Papple! 🍦"',
        '"Muak muak muak! 😘"',
        '"Kampai! 🥂"'
    ];

    function randomQuote() {
        const random = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-text').innerText = random;
    }

    function toggleForm() {
        isLogin = !isLogin;
        const signupFields = document.getElementById('signup-fields');
        if (isLogin) {
            signupFields.style.display = 'none';
            document.getElementById('form-title').innerHTML = 'BEE-DOO! &#128680;';
            document.getElementById('form-subtitle').innerText = "Enter Gru's Lab before the alarm triggers!";
            document.getElementById('submit-btn').innerHTML = 'Log In &#128640;';
            document.getElementById('toggle-label').innerText = "Don't have an ID?";
            document.getElementById('toggle-link').innerText = "Join Gru's Crew";
        } else {
            signupFields.style.display = 'block';
            document.getElementById('form-title').innerHTML = 'JOIN THE CREW! &#129514;';
            document.getElementById('form-subtitle').innerText = 'Fill in your details to serve Gru';
            document.getElementById('submit-btn').innerHTML = 'Become a Minion &#127820;';
            document.getElementById('toggle-label').innerText = 'Already part of the crew?';
            document.getElementById('toggle-link').innerText = 'Log In';
        }
        document.getElementById('message').innerText = '';
    }

    async function submitAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('message');

        const endpoint = isLogin ? '/api/login' : '/api/register';
        let bodyData = { username, password };

        if (!isLogin) {
            bodyData.fullName = document.getElementById('fullName').value.trim();
            bodyData.email = document.getElementById('email').value.trim();
            bodyData.phone = document.getElementById('phone').value.trim();
        }

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });

            const data = await res.json();
            if (!res.ok) {
                msg.style.color = '#ef4444';
                msg.innerText = data.error;
            } else {
                msg.style.color = '#22c55e';
                msg.innerText = data.message;
                if (isLogin) {
                    setTimeout(() => window.location.href = '/dashboard.html', 500);
                } else {
                    setTimeout(() => toggleForm(), 1200);
                }
            }
        } catch (e) {
            msg.style.color = '#ef4444';
            msg.innerText = 'Server unreachable!';
        }
    }
</script>
</body>
</html>
