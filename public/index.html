<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gru's Secret Lab - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e3a8a;
            overflow: hidden;
            position: relative;
        }

        /* --- 1. BRIGHT ROBLOX-STYLE TILTED MINION GRID --- */
        .roblox-grid {
            position: fixed;
            top: -25%;
            left: -20%;
            width: 140%;
            height: 150%;
            transform: rotate(-12deg);
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 1;
            pointer-events: none;
        }
        .grid-row {
            display: flex;
            gap: 18px;
            justify-content: center;
        }
        .minion-tile {
            width: 240px;
            height: 145px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            border: 3px solid rgba(254, 219, 0, 0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            flex-shrink: 0;
            background-color: #3b82f6;
        }

        /* --- 2. SOFT VIGNETTE OVERLAY --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- 3. FOREGROUND LOGIN CARD --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Interactive Minion */
        .minion-head {
            width: 130px;
            height: 130px;
            background: #fedb00;
            border-radius: 65px 65px 40px 40px;
            border: 4px solid #18181b;
            position: relative;
            margin-bottom: -40px;
            z-index: 15;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .hair {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
        }
        .hair div { width: 3px; height: 12px; background: #18181b; }
        .hair div:nth-child(1) { transform: rotate(-15deg); }
        .hair div:nth-child(3) { transform: rotate(15deg); }

        .strap {
            width: 100%;
            height: 16px;
            background: #18181b;
            position: absolute;
            top: 42px;
        }
        .goggle-rim {
            width: 58px;
            height: 58px;
            background: #d4d4d8;
            border: 5px solid #52525b;
            border-radius: 50%;
            position: absolute;
            top: 21px;
            left: calc(50% - 29px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .eye-socket {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .eyelid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: #fedb00;
            border-bottom: 3px solid #18181b;
            transition: height 0.2s ease-in-out;
            z-index: 5;
        }
        .pupil-track {
            width: 16px;
            height: 16px;
            background: #854d0e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease-out;
        }
        .pupil-dot {
            width: 8px;
            height: 8px;
            background: #09090b;
            border-radius: 50%;
            position: relative;
        }
        .pupil-dot::after {
            content: '';
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1px; left: 1px;
        }
        .mouth {
            width: 28px;
            height: 12px;
            border-bottom: 4px solid #18181b;
            border-radius: 0 0 30px 30px;
            position: absolute;
            bottom: 20px;
            left: calc(50% - 14px);
        }

        /* Bright, Crisp White Card */
        .card {
            background: #ffffff;
            border: 4px solid #fedb00;
            width: 380px;
            padding: 55px 32px 30px 32px;
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.4);
            text-align: center;
            color: #1e293b;
        }
        h2 { margin: 0 0 4px 0; color: #1e3a8a; font-size: 26px; font-weight: 700; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 16px; }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 6px 0;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #fedb00;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(254, 219, 0, 0.4);
        }

        #signup-fields { display: none; }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: #fedb00;
            color: #1e3a8a;
            border: 2px solid #ca8a04;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            margin-top: 12px;
            font-family: inherit;
            box-shadow: 0 4px 0 #ca8a04;
            transition: all 0.1s ease;
        }
        button.submit-btn:hover { background: #fde047; transform: translateY(-2px); box-shadow: 0 6px 0 #ca8a04; }
        button.submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #ca8a04; }

        .toggle-box { margin-top: 16px; font-size: 14px; color: #64748b; }
        .toggle-box a { color: #2563eb; font-weight: 700; text-decoration: underline; cursor: pointer; }
        .message { margin-top: 10px; font-size: 13px; font-weight: 600; min-height: 18px; }
    </style>
</head>
<body>

    <!-- 1. Tilted Minion Tiles -->
    <div class="roblox-grid">
        <div class="grid-row">
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/chzz1FQgqhytWRWbp3/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/m6OomwWCojfS8/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/daPCSjwus6UR2/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/105OwsN7a4UQ2Q/giphy.gif');"></div>
        </div>
        <div class="grid-row">
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/3o7TKTDnUxE0g2fSE8/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/ule4akeXnY9Mb2kfTM/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/YAlhwn8730P4DUZ6Zh/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/MOWPkhWkhRbnW/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif');"></div>
        </div>
        <div class="grid-row">
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/daPCSjwus6UR2/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/m6OomwWCojfS8/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/oLHaxZoXbcU6Y/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/3o7TKTDnUxE0g2fSE8/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/chzz1FQgqhytWRWbp3/giphy.gif');"></div>
        </div>
        <div class="grid-row">
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/MOWPkhWkhRbnW/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/105OwsN7a4UQ2Q/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/YAlhwn8730P4DUZ6Zh/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/ule4akeXnY9Mb2kfTM/giphy.gif');"></div>
            <div class="minion-tile" style="background-image: url('https://media.giphy.com/media/daPCSjwus6UR2/giphy.gif');"></div>
        </div>
    </div>

    <!-- 2. Overlay -->
    <div class="overlay"></div>

    <!-- 3. Foreground Form -->
    <div class="login-wrapper">
        <div class="minion-head">
            <div class="hair"><div></div><div></div><div></div></div>
            <div class="strap"></div>
            <div class="goggle-rim">
                <div class="eye-socket" id="eye-socket">
                    <div class="eyelid" id="eyelid"></div>
                    <div class="pupil-track" id="pupil">
                        <div class="pupil-dot"></div>
                    </div>
                </div>
            </div>
            <div class="mouth"></div>
        </div>

        <div class="card">
            <h2 id="form-title">BELLO! &#127820;</h2>
            <div class="subtitle" id="form-subtitle">Enter your Minion credentials</div>

            <div id="signup-fields">
                <input type="text" id="fullName" placeholder="Full Minion Name">
                <input type="email" id="email" placeholder="Email Address">
                <input type="tel" id="phone" placeholder="Contact Number (e.g. 09123456789)">
            </div>

            <input type="text" id="username" placeholder="Username or Email" required>
            <input type="password" id="password" placeholder="Banana Code (Password)" required>

            <button class="submit-btn" id="submit-btn" onclick="submitAuth()">Log In &#128640;</button>
            <div id="message" class="message"></div>

            <div class="toggle-box">
                <span id="toggle-label">Don't have an ID?</span>
                <a onclick="toggleForm()" id="toggle-link">Join Gru's Crew</a>
            </div>
        </div>
    </div>

<script>
    let isLogin = true;
    let isPasswordFocused = false;

    const eyeSocket = document.getElementById('eye-socket');
    const pupil = document.getElementById('pupil');
    const eyelid = document.getElementById('eyelid');
    const passwordInput = document.getElementById('password');

    // Follow cursor
    window.addEventListener('mousemove', (e) => {
        if (isPasswordFocused) return;
        const rect = eyeSocket.getBoundingClientRect();
        const eyeX = rect.left + rect.width / 2;
        const eyeY = rect.top + rect.height / 2;
        const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
        const distance = Math.min(7, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 12);
        pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
    });

    // Close eye on password
    passwordInput.addEventListener('focus', () => {
        isPasswordFocused = true;
        eyelid.style.height = '100%';
    });
    passwordInput.addEventListener('blur', () => {
        isPasswordFocused = false;
        eyelid.style.height = '0%';
    });

    function toggleForm() {
        isLogin = !isLogin;
        const signupFields = document.getElementById('signup-fields');
        if (isLogin) {
            signupFields.style.display = 'none';
            document.getElementById('form-title').innerHTML = 'BELLO! &#127820;';
            document.getElementById('form-subtitle').innerText = 'Enter your Minion credentials';
            document.getElementById('submit-btn').innerHTML = 'Log In &#128640;';
            document.getElementById('toggle-label').innerText = "Don't have an ID?";
            document.getElementById('toggle-link').innerText = "Join Gru's Crew";
        } else {
            signupFields.style.display = 'block';
            document.getElementById('form-title').innerHTML = 'JOIN THE CREW! &#129514;';
            document.getElementById('form-subtitle').innerText = 'Fill in your details to serve Gru';
            document.getElementById('submit-btn').innerHTML = 'Become a Minion &#127820;';
            document.getElementById('toggle-label').innerText = 'Already part of the crew?';
            document.getElementById('toggle-link').innerText = 'Log In';
        }
        document.getElementById('message').innerText = '';
    }

    async function submitAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('message');

        const endpoint = isLogin ? '/api/login' : '/api/register';
        let bodyData = { username, password };

        if (!isLogin) {
            bodyData.fullName = document.getElementById('fullName').value.trim();
            bodyData.email = document.getElementById('email').value.trim();
            bodyData.phone = document.getElementById('phone').value.trim();
        }

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });

            const data = await res.json();
            if (!res.ok) {
                msg.style.color = '#ef4444';
                msg.innerText = data.error;
            } else {
                msg.style.color = '#22c55e';
                msg.innerText = data.message;
                if (isLogin) {
                    setTimeout(() => window.location.href = '/dashboard.html', 500);
                } else {
                    setTimeout(() => toggleForm(), 1200);
                }
            }
        } catch (e) {
            msg.style.color = '#ef4444';
            msg.innerText = 'Server unreachable!';
        }
    }
</script>
</body>
</html>
