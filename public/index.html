<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gru's Secret Lab - Minion Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* --- 1. FULLSCREEN TRAILER VIDEO BACKGROUND --- */
        .video-background {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .video-background iframe {
            position: absolute;
            top: 50%; left: 50%;
            width: 100vw; height: 56.25vw; /* 16:9 Aspect Ratio */
            min-height: 100vh; min-width: 177.77vh;
            transform: translate(-50%, -50%) scale(1.1);
            filter: brightness(0.65) contrast(1.05);
            pointer-events: none;
        }

        /* Dark Vignette Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.88) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- 2. FOREGROUND CARD --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        /* --- INTERACTIVE MINION CIRCULAR BADGE --- */
        .minion-circle {
            width: 120px;
            height: 120px;
            background: #fedb00;
            border-radius: 50%;
            border: 4px solid #fedb00;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 20px rgba(254, 219, 0, 0.5);
            position: relative;
            margin-bottom: -45px;
            z-index: 20;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Minion Hair */
        .hair {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
        }
        .hair div { width: 3px; height: 10px; background: #18181b; }
        .hair div:nth-child(1) { transform: rotate(-15deg); }
        .hair div:nth-child(3) { transform: rotate(15deg); }

        /* Goggle Strap */
        .strap {
            width: 100%;
            height: 16px;
            background: #18181b;
            position: absolute;
            top: 45px;
        }

        /* Silver Goggle Rim */
        .goggle-rim {
            width: 56px;
            height: 56px;
            background: #d4d4d8;
            border: 5px solid #52525b;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            left: calc(50% - 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* Eye & Eye-lid (closes on password) */
        .eye-socket {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .eyelid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 0%;
            background: #fedb00;
            border-bottom: 3px solid #18181b;
            transition: height 0.22s ease-in-out;
            z-index: 5;
        }
        .pupil-track {
            width: 16px;
            height: 16px;
            background: #854d0e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease-out;
        }
        .pupil-dot {
            width: 8px;
            height: 8px;
            background: #09090b;
            border-radius: 50%;
            position: relative;
        }
        .pupil-dot::after {
            content: '';
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1px; left: 1px;
        }

        /* Minion Smile */
        .mouth {
            width: 24px;
            height: 10px;
            border-bottom: 3px solid #18181b;
            border-radius: 0 0 24px 24px;
            position: absolute;
            bottom: 16px;
            left: calc(50% - 12px);
        }

        /* --- THE CARD --- */
        .card {
            background: rgba(255, 255, 255, 0.96);
            border: 4px solid #fedb00;
            width: 100%;
            padding: 55px 28px 24px 28px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: center;
            color: #1e3a8a;
        }

        h2 { margin: 0 0 4px 0; font-size: 26px; font-weight: 700; color: #1e3a8a; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 16px; }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 6px 0;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #fedb00;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(254, 219, 0, 0.4);
        }

        #signup-fields { display: none; }

        button.submit-btn {
            width: 100%;
            padding: 13px;
            background: #fedb00;
            color: #1e3a8a;
            border: 2px solid #ca8a04;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            margin-top: 10px;
            font-family: inherit;
            box-shadow: 0 4px 0 #ca8a04;
            transition: all 0.1s ease;
        }
        button.submit-btn:hover { background: #fde047; transform: translateY(-2px); box-shadow: 0 6px 0 #ca8a04; }
        button.submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #ca8a04; }

        .toggle-box { margin-top: 14px; font-size: 14px; color: #64748b; }
        .toggle-box a { color: #2563eb; font-weight: 700; text-decoration: underline; cursor: pointer; }
        .message { margin-top: 8px; font-size: 13px; font-weight: 600; min-height: 18px; }

        .gibberish-box {
            margin-top: 14px;
            background: #fef08a;
            border: 2px dashed #ca8a04;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #854d0e;
            cursor: pointer;
            user-select: none;
        }
        .gibberish-box:hover { background: #fde047; }
    </style>
</head>
<body>

    <!-- 1. Trailer Video Background (Despicable Me 4 Official Trailer) -->
    <div class="video-background">
        <iframe 
            src="https://www.youtube.com/embed/bCcVSW-c3nA?autoplay=1&mute=1&controls=0&loop=1&playlist=bCcVSW-c3nA&playsinline=1&modestbranding=1" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>
    <div class="overlay"></div>

    <!-- 2. Login Form Wrapper -->
    <div class="login-wrapper">

        <!-- INTERACTIVE MINION CIRCLE (Eye tracks mouse, closes on password) -->
        <div class="minion-circle">
            <div class="hair"><div></div><div></div><div></div></div>
            <div class="strap"></div>
            <div class="goggle-rim">
                <div class="eye-socket" id="eye-socket">
                    <div class="eyelid" id="eyelid"></div>
                    <div class="pupil-track" id="pupil">
                        <div class="pupil-dot"></div>
                    </div>
                </div>
            </div>
            <div class="mouth"></div>
        </div>

        <div class="card">
            <h2 id="form-title">BELLO! &#127820;</h2>
            <div class="subtitle" id="form-subtitle">Enter Gru's Lab to access the network</div>

            <div id="signup-fields">
                <input type="text" id="fullName" placeholder="Full Minion Name">
                <input type="email" id="email" placeholder="Email Address">
                <input type="tel" id="phone" placeholder="Contact Number (e.g. 09123456789)">
            </div>

            <input type="text" id="username" placeholder="Username or Email" required>
            <input type="password" id="password" placeholder="Banana Code (Password)" required>

            <button class="submit-btn" id="submit-btn" onclick="submitAuth()">Log In &#128640;</button>
            <div id="message" class="message"></div>

            <div class="toggle-box">
                <span id="toggle-label">Don't have an ID?</span>
                <a onclick="toggleForm()" id="toggle-link">Join Gru's Crew</a>
            </div>

            <div class="gibberish-box" onclick="randomQuote()">
                &#127820; Minion Translator: <b id="quote-text">"Papoi? Gelato!"</b> <i>(Click for new quote)</i>
            </div>
        </div>
    </div>

<script>
    let isLogin = true;
    let isPasswordFocused = false;

    // --- INTERACTIVE EYE LOGIC ---
    const eyeSocket = document.getElementById('eye-socket');
    const pupil = document.getElementById('pupil');
    const eyelid = document.getElementById('eyelid');
    const passwordInput = document.getElementById('password');

    // 1. Pupil tracks mouse cursor
    window.addEventListener('mousemove', (e) => {
        if (isPasswordFocused) return;
        const rect = eyeSocket.getBoundingClientRect();
        const eyeX = rect.left + rect.width / 2;
        const eyeY = rect.top + rect.height / 2;
        const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
        const distance = Math.min(6, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 14);
        pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
    });

    // 2. Closes eyes completely when typing password ("No peeking!")
    passwordInput.addEventListener('focus', () => {
        isPasswordFocused = true;
        eyelid.style.height = '100%';
    });
    passwordInput.addEventListener('blur', () => {
        isPasswordFocused = false;
        eyelid.style.height = '0%';
    });

    // Quotes
    const quotes = [
        '"BEE-DOO! BEE-DOO! 🚨"',
        '"BANANAAAAAA! 🍌"',
        '"Poopaye! Bello! 👋"',
        '"Tulaliloo ti amo! ❤️"',
        '"Underwear... hehehe! 😂"',
        '"Gelato! Papple! 🍦"',
        '"Muak muak muak! 😘"'
    ];

    function randomQuote() {
        const random = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-text').innerText = random;
    }

    function toggleForm() {
        isLogin = !isLogin;
        const signupFields = document.getElementById('signup-fields');
        if (isLogin) {
            signupFields.style.display = 'none';
            document.getElementById('form-title').innerHTML = 'BELLO! &#127820;';
            document.getElementById('form-subtitle').innerText = "Enter Gru's Lab to access the network";
            document.getElementById('submit-btn').innerHTML = 'Log In &#128640;';
            document.getElementById('toggle-label').innerText = "Don't have an ID?";
            document.getElementById('toggle-link').innerText = "Join Gru's Crew";
        } else {
            signupFields.style.display = 'block';
            document.getElementById('form-title').innerHTML = 'JOIN THE CREW! &#129514;';
            document.getElementById('form-subtitle').innerText = 'Fill in your details to serve Gru';
            document.getElementById('submit-btn').innerHTML = 'Become a Minion &#127820;';
            document.getElementById('toggle-label').innerText = 'Already part of the crew?';
            document.getElementById('toggle-link').innerText = 'Log In';
        }
        document.getElementById('message').innerText = '';
    }

    async function submitAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('message');

        const endpoint = isLogin ? '/api/login' : '/api/register';
        let bodyData = { username, password };

        if (!isLogin) {
            bodyData.fullName = document.getElementById('fullName').value.trim();
            bodyData.email = document.getElementById('email').value.trim();
            bodyData.phone = document.getElementById('phone').value.trim();
        }

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });

            const data = await res.json();
            if (!res.ok) {
                msg.style.color = '#ef4444';
                msg.innerText = data.error;
            } else {
                msg.style.color = '#22c55e';
                msg.innerText = data.message;
                if (isLogin) {
                    setTimeout(() => window.location.href = '/dashboard.html', 500);
                } else {
                    setTimeout(() => toggleForm(), 1200);
                }
            }
        } catch (e) {
            msg.style.color = '#ef4444';
            msg.innerText = 'Server unreachable!';
        }
    }
</script>
</body>
</html>
